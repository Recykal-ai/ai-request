function buildLevels(){
 return LVMETA.map(lv=>{
  if(lv.type==="neural")return lv;
  const qs=pick(BANKS[lv.bank],2).map(q=>{
   if(q.type==="scramble")return{...q,tiles:shu([...q.tiles.map(t=>t)])};
   if(q.type==="fill")return{...q};
   const idxs=shu([0,1,2,3]);
   return{...q,options:idxs.map(j=>q.options[j]),ci:idxs.indexOf(q.ci)};
  });
  return{...lv,questions:qs};
 });
}

/* ─── NEURAL NETWORK GAME ─── */
function NeuralGame({onWin,onLoseLife,ac,acd}){
 const [pairs]=useState(()=>shu([...NN_SETS[0|Math.random()*NN_SETS.length]]));
 const [rOrd]=useState(()=>shu([0,1,2,3]));
 const [sel,setSel]=useState(null);
 const [done,setDone]=useState({});
 const [flash,setFlash]=useState(null);
 const [wrongIdx,setWrongIdx]=useState(null);

 const W=560,H=320,LX=120,RX=440,MX=280,NH=52,NG=16;
 const tot=4*NH+3*NG,top=(H-tot)/2;
 const LY=i=>top+i*(NH+NG)+NH/2;
 const RY=pos=>top+pos*(NH+NG)+NH/2;
 const path=(li,ri)=>{const ly=LY(li),ry=RY(ri);return "M "+LX+" "+ly+" C "+(MX-60)+" "+ly+" "+(MX+60)+" "+ry+" "+RX+" "+ry};

 const tapLeft=i=>{if(done[i]!==undefined)return;setSel(s=>s===i?null:i);};
 const tapRight=pos=>{
  if(sel===null)return;
  if(rOrd[pos]===sel){
   const nd={...done,[sel]:pos};
   setDone(nd);setFlash({li:sel,ri:pos,ok:true});setSel(null);
   setTimeout(()=>setFlash(null),550);
   if(Object.keys(nd).length===4)setTimeout(onWin,700);
  }else{
   setWrongIdx(sel);setFlash({li:sel,ri:pos,ok:false});setSel(null);
   onLoseLife();
   setTimeout(()=>{setFlash(null);setWrongIdx(null);},700);
  }
 };

 return(
  <div className="nncard">
   <div className="nnhead">🔗 Neural Network Challenge</div>
   <div className="nnsub">Tap an expression on the LEFT, then tap its correct answer on the RIGHT to connect them through the network</div>
   <svg viewBox={"0 0 "+W+" "+H} style={{width:"100%",height:"auto",display:"block",touchAction:"none"}}>
    {/* Hidden layer nodes */}
    {[H*.22,H*.44,H*.66,H*.88].map((y,i)=><circle key={i} cx={MX} cy={y} r={9} fill="#E8DDD6" opacity={.6}/>)}
    {/* Faint background mesh */}
    {[0,1,2,3].map(li=>[H*.22,H*.44,H*.66,H*.88].map((hy,mi)=><path key={li+"-"+mi} d={"M "+LX+" "+LY(li)+" Q "+(LX+MX)/2+" "+((LY(li)+hy)/2)+" "+MX+" "+hy} stroke="#F0EBE4" strokeWidth={1} fill="none"/>))}
    {/* Correct lines */}
    {Object.entries(done).map(([li2,rp])=><path key={"ok"+li2} d={path(+li2,rp)} stroke="#52C788" strokeWidth={3.5} fill="none" strokeLinecap="round" strokeDasharray={400} strokeDashoffset={0} style={{animation:"lineIn .4s ease"}}/>)}
    {/* Flash line */}
    {flash&&<path d={path(flash.li,flash.ri)} stroke={flash.ok?"#52C788":"#FF8A80"} strokeWidth={3.5} fill="none" strokeLinecap="round"/>}
    {/* LEFT expression boxes */}
    {pairs.map((p,i)=>{
     const y=LY(i),dn=done[i]!==undefined,sl=sel===i,wr=wrongIdx===i;
     const fill=dn?"#A8E6CF":sl?ac:wr?"#FFD0D0":"#FAF6F2";
     const str=dn?"#52C788":sl?acd:wr?"#FF8A80":"#E0D8D0";
     return(
      <g key={"L"+i} style={{cursor:dn?"default":"pointer"}} onClick={()=>tapLeft(i)}>
       <rect x={LX-100} y={y-NH/2} width={200} height={NH} rx={14} fill={fill} stroke={str} strokeWidth={sl?3:2}/>
       <text x={LX} y={y+7} textAnchor="middle" fontFamily="Cooper Black,Lilita One,serif" fontSize={17} fontWeight={900} fill={dn?"#1A5C38":sl?"#fff":"#2D1E0F"} style={{pointerEvents:"none",userSelect:"none"}}>{p.expr}</text>
      </g>
     );
    })}
    {/* RIGHT answer boxes */}
    {rOrd.map((pi,pos)=>{
     const y=RY(pos),dn=Object.values(done).includes(pos);
     return(
      <g key={"R"+pos} style={{cursor:dn?"default":"pointer"}} onClick={()=>tapRight(pos)}>
       <rect x={RX-44} y={y-NH/2} width={88} height={NH} rx={14} fill={dn?"#A8E6CF":"#FAF6F2"} stroke={dn?"#52C788":"#E0D8D0"} strokeWidth={2}/>
       <text x={RX} y={y+8} textAnchor="middle" fontFamily="Cooper Black,Lilita One,serif" fontSize={20} fontWeight={900} fill={dn?"#1A5C38":"#2D1E0F"} style={{pointerEvents:"none",userSelect:"none"}}>{pairs[pi].ans}</text>
      </g>
     );
    })}
    {sel!==null&&<circle cx={LX+102} cy={LY(sel)} r={5} fill={ac} style={{pointerEvents:"none"}}/>}
   </svg>
   <div className="nnstatus">{Object.keys(done).length}/4 connected {sel!==null?"— now tap an answer on the right →":"— tap any expression to begin"}</div>
  </div>
 );
}

function Leaderboard({myName,myEmpId,myTime}){
 const [rows,setRows]=useState(null);
 const [loading,setLoading]=useState(true);
 const [myRank,setMyRank]=useState(null);
 const load=useCallback(async()=>{
  setLoading(true);
  const raw=await dbRead();
  if(raw&&typeof raw==="object"&&Object.keys(raw).length>0){
   const arr=Object.values(raw).sort((a,b)=>a.timeTaken-b.timeTaken);
   setRows(arr);
   const idx=arr.findIndex(r=>r.name===myName&&r.empId===myEmpId&&Math.abs(r.timeTaken-myTime)<12000);
   if(idx>=0)setMyRank(idx+1);
  }else{setRows([])}
  setLoading(false);
 },[myName,myEmpId,myTime]);
 useEffect(()=>{const t=setTimeout(load,1500);const id=setInterval(load,15000);return()=>{clearTimeout(t);clearInterval(id)}},[]);
 if(!DBON)return(<div className="lbcfg"><b>Enable Live Leaderboard</b>Open this HTML file in Notepad and replace the Firebase URL and API Key at the very top of the file with your actual values from Firebase console.</div>);
 return(
  <div className="lbsec">
   <div className="lbhdr">
    <div className="lbhtitle">🏆 Leaderboard</div>
    <button className={"lbbtn"+(loading?" sp":"")} onClick={load}>
     <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
     {loading?"Loading...":"Refresh"}
    </button>
   </div>
   {myRank&&<div className="rankbdg">You placed <span className="ranknum">#{myRank}</span> {myRank===1?"🥇":myRank===2?"🥈":myRank===3?"🥉":"🎉"}</div>}
   {!rows||rows.length===0?(<div className="lbempty">{loading?"Loading scores...":"No scores yet — be first! 🚀"}</div>):
    rows.slice(0,12).map((r,i)=>{
     const isMe=r.name===myName&&r.empId===myEmpId&&Math.abs(r.timeTaken-myTime)<12000;
     const cls=isMe?"me":i===0?"p1":i===1?"p2":i===2?"p3":"px";
     return(
      <div key={i} className={"lbrow "+cls} style={{animationDelay:i*.05+"s"}}>
       <div className="lbrank">{i<3?MED[i]:i+1}</div>
       <div className="lbinfo"><div className="lbname">{r.name}{isMe&&<span className="metag">YOU</span>}</div><div className="lbemp">{r.empId}</div></div>
       <div style={{textAlign:"right"}}>
        <div className="lbtime" style={{color:i===0?"#B8860B":i===1?"#888":i===2?"#C04A20":"#A0917F"}}>⏱️ {fmtMs(r.timeTaken)}</div>
        <div className="lblives">{"❤️".repeat(r.livesLeft)}{"🖤".repeat(3-r.livesLeft)}</div>
       </div>
      </div>
     );
    })}
  </div>
 );
}

function Banner({sub}){return(<div className="banner"><img src={LOGO} className="logo" alt="Recykal"/><span className="btag">{sub||"Tech Day 2025"}</span></div>);}

/* ─── SCREENS ─── */
function LoginScreen({onLogin}){
 const [name,setName]=useState(""),[email,setEmail]=useState(""),[empId,setEmpId]=useState("");
 const ok=name.trim().length>1&&email.includes("@")&&empId.trim().length>0;
 const go=()=>ok&&onLogin(name.trim(),email.trim(),empId.trim());
 return(<div className="screen lscreen"><div className="blobs"><div className="blob b1"/><div className="blob b2"/><div className="blob b3"/></div><Banner/>
  <div className="card"><div style={{fontSize:"3.8rem",marginBottom:7,animation:"float 3s ease-in-out infinite"}}>🤖</div>
   <h1 className="gtitle"><span className="tai">AI </span>Quest</h1><p className="lsub">Escape the office. Prove you know AI! 🏃</p>
   <div className="fg"><label className="fl">Full Name</label><input className="fi" type="text" placeholder="e.g. Priya Sharma" value={name} onChange={e=>setName(e.target.value)}/></div>
   <div className="fg"><label className="fl">Work Email</label><input className="fi" type="email" placeholder="you@recykal.com" value={email} onChange={e=>setEmail(e.target.value)}/></div>
   <div className="fg"><label className="fl">Employee ID</label><input className="fi" type="text" placeholder="e.g. RCY-1042" value={empId} onChange={e=>setEmpId(e.target.value)} onKeyDown={e=>e.key==="Enter"&&go()}/></div>
   <button className="btn btnblue" disabled={!ok} onClick={go}>Lets Go!</button>
  </div>
 </div>);
}

function StartScreen({player,onStart}){
 return(<div className="screen lscreen"><div className="blobs"><div className="blob b1"/><div className="blob b2"/><div className="blob b3"/></div><Banner/>
  <div className="card wide"><div style={{fontSize:"3.8rem",marginBottom:7,animation:"float 3s ease-in-out infinite"}}>🤖</div>
   <h1 className="gtitle"><span className="tai">AI </span>Quest</h1><p className="lsub">Escape the office. Prove you know AI! 🏃</p>
   <div className="wpill">Hey <span>{player.name}</span>! Questions are randomised every game 👋</div>
   <div className="rgrid">
    <div className="rc"><span className="re">🏢</span><div className="rt"><strong>5 Levels</strong>Desk, Break Room, Neural Net, Meeting, Exit</div></div>
    <div className="rc"><span className="re">⏱️</span><div className="rt"><strong>Shrinking Timers!</strong>30s → 25s → 20s → 16s → 12s</div></div>
    <div className="rc"><span className="re">💔</span><div className="rt"><strong>3 Lives — FINAL</strong>Lose all 3 and the game ENDS. No second chance!</div></div>
    <div className="rc"><span className="re">🏆</span><div className="rt"><strong>Live Leaderboard</strong>Your rank shown the moment you finish!</div></div>
   </div>
   <button className="btn btnblue" onClick={onStart}>START PLAYING →</button>
  </div>
 </div>);
}

function CompleteScreen({player,timeTaken,livesLeft,onRestart}){
 return(<div className="screen cscreen"><Confetti/><div className="blobs"><div className="blob b1"/><div className="blob b2"/><div className="blob b3"/></div><Banner/>
  <div className="ccard">
   <span className="trophy">🏆</span>
   <h2 className="ctitle">You Escaped!</h2>
   <p className="csub">All 5 levels crushed! Great work 🎉</p>
   <div className="srow">
    <div className="sbox"><div className="sval">⏱️ {fmtMs(timeTaken)}</div><div className="skey">Your Time</div></div>
    <div className="sbox"><div className="sval">{"❤️".repeat(livesLeft)}{"🖤".repeat(3-livesLeft)}</div><div className="skey">Lives Left</div></div>
   </div>
   <Leaderboard myName={player.name} myEmpId={player.empId} myTime={timeTaken}/>
   <button className="brtn" onClick={onRestart}>↩ Play again</button>
  </div>
 </div>);
}

/* ─── GAME SCREEN ─── */
function GameScreen({player,onComplete,onGameOver}){
 const [LEVELS]=useState(()=>buildLevels());
 const [li,setLi]=useState(0);
 const [qi,setQi]=useState(0);
 const livesRef=useRef(3);
 const [livesDisplay,setLivesDisplay]=useState(3);
 const [dead,setDead]=useState(false);
 const [hint,setHint]=useState(false);
 const [toMsg,setToMsg]=useState(false);
 const [sel,setSel]=useState(null);
 const [inp,setInp]=useState("");
 const [cs,setCs]=useState(null);
 const [trans,setTrans]=useState(null);
 const [burst,setBurst]=useState(false);
 const [hb,setHb]=useState(-1);
 const [tkey,setTkey]=useState(0);
 const [tLeft,setTLeft]=useState(TIMERS[0]);
 const [tRun,setTRun]=useState(true);
 const deadRef=useRef(false);
 const t0=useRef(Date.now());
 const iRef=useRef(null);
 const lv=LEVELS[li],isNN=lv.type==="neural",q=isNN?null:lv.questions[qi],ts=TIMERS[li];
 const canSub=!isNN&&(q.type==="mcq"?sel!==null:inp.trim().length>0);

 const stopT=()=>{clearInterval(iRef.current);setTRun(false)};
 const startT=s=>{clearInterval(iRef.current);setTLeft(s);setTRun(true)};

 /* LOSE ONE LIFE — returns new count */
 const loseLife=useCallback(()=>{
  const nl=Math.max(0,livesRef.current-1);
  livesRef.current=nl;
  setLivesDisplay(nl);
  setHb(nl);
  setTimeout(()=>setHb(-1),500);
  if(nl===0&&!deadRef.current){deadRef.current=true;stopT();setTimeout(()=>setDead(true),600);}
  return nl;
 },[]);

 const handleTO=useCallback(()=>{
  if(deadRef.current)return;
  setCs("timeout");setToMsg(true);setHint(true);
  const nl=loseLife();
  if(nl>0){setTimeout(()=>{setCs(null);setSel(null);setInp("");setToMsg(false);setTkey(k=>k+1);startT(TIMERS[li])},1200);}
 },[li,loseLife]);

 useEffect(()=>{
  if(!tRun||trans||cs||isNN||dead)return;
  iRef.current=setInterval(()=>setTLeft(t=>{if(t<=1){clearInterval(iRef.current);handleTO();return 0}return t-1}),1000);
  return()=>clearInterval(iRef.current);
 },[tRun,trans,cs,tkey,isNN,dead]);

 const advLv=useCallback(()=>{
  if(li===LEVELS.length-1){onComplete(Date.now()-t0.current,livesRef.current);}
  else{
   const nl=li+1;
   setTrans({msg:"Level "+(li+1)+" Complete!",sub:"Moving to "+LEVELS[nl].name+"...",icon:LEVELS[nl].icon,note:"Timer: "+TIMERS[nl]+"s",bg:LEVELS[nl].bg,text:LEVELS[nl].text});
   setTimeout(()=>{setTrans(null);setLi(nl);setQi(0);setHint(false);setTkey(k=>k+1);startT(TIMERS[nl])},900);
  }
 },[li,LEVELS]);

 const advance=useCallback(()=>{isNN||qi===1?advLv():(() =>{setQi(1);setTkey(k=>k+1);startT(ts);})();},[isNN,qi,ts,advLv]);

 const check=()=>{
  if(cs||dead)return;
  const ok=q.type==="mcq"?sel===q.ci:inp.trim().toLowerCase()===q.answer.toLowerCase();
  if(ok){
   stopT();setCs("correct");setBurst(true);
   setTimeout(()=>setBurst(false),400);
   setTimeout(()=>{setCs(null);setHint(false);setToMsg(false);setSel(null);setInp("");advance()},450);
  }else{
   stopT();setCs("wrong");
   const nl=loseLife();
   setHint(true);
   if(nl>0){setTimeout(()=>{setCs(null);setSel(null);setInp("");setTkey(k=>k+1);startT(ts)},900);}
  }
 };

 const pct=(tLeft/ts)*100,tst=tLeft>ts*.5?"ok":tLeft>ts*.2?"warn":"danger",tcol=tLeft>ts*.5?lv.ac:tLeft>ts*.2?"#E8A23C":"#E85757";

 return(
  <div className="screen gscreen" style={{background:lv.bg,paddingTop:54}}>
   <Banner sub={lv.name}/>

   {/* ── GAME OVER OVERLAY ── */}
   {dead&&(
    <div className="govl">
     <div style={{fontSize:"5rem",marginBottom:10}}>💔</div>
     <div style={{fontFamily:"var(--fd)",fontSize:"2.2rem",color:"#6E2A0A",marginBottom:6}}>Game Over!</div>
     <div style={{fontSize:"1rem",color:"#B36040",marginBottom:4}}>You used all 3 lives.</div>
     <div style={{fontSize:".9rem",color:"#B36040",marginBottom:22}}>Time: {fmtMs(Date.now()-t0.current)}</div>
     <button className="btn btnred" style={{width:"auto",padding:"13px 40px"}} onClick={onGameOver}>Try Again 🔄</button>
    </div>
   )}

   {/* ── LEVEL TRANSITION ── */}
   {trans&&!dead&&(
    <div className="tovl" style={{background:trans.bg}}>
     <div style={{fontSize:"5rem",marginBottom:10,animation:"float 1s ease-in-out infinite"}}>{trans.icon}</div>
     <div className="ttitle" style={{color:trans.text}}>{trans.msg}</div>
     <div className="tsub" style={{color:trans.text}}>{trans.sub}</div>
     <div className="tnote" style={{color:trans.text}}>{trans.note}</div>
    </div>
   )}

   {burst&&<div className="covl"><div className="cburst">✅</div></div>}

   <div className="gw" key={li+"-"+qi}>
    <div className="ghdr">
     <div className="lbadge" style={{borderColor:lv.ac,color:lv.text}}>Level {li+1}/5 — {lv.name}</div>
     <div className="lvs">{[0,1,2].map(i=><span key={i} className={"hrt"+(i>=livesDisplay?" lost":"")+(hb===i?" beat":"")}>❤️</span>)}</div>
    </div>
    {!isNN&&(<div className="trow">
     <div className={"tnum "+tst}>{tLeft}s</div>
     <div className="tbw"><div className="tbf" style={{width:pct+"%",background:tcol}}/></div>
     <div className="tlbl">time left</div>
    </div>)}
    <div className="ptrow">
     <div className="pbw"><div className="pbf" style={{width:((li*2+qi)/10*100)+"%",background:lv.ac}}/></div>
     <span className="plbl">{li*2+qi}/10</span>
    </div>
    <div className="lscene" style={{background:lv.bg,boxShadow:"0 4px 18px "+lv.ac+"28"}}>
     <div className="sdeco">{lv.deco}</div>
     <div><div className="stitle" style={{color:lv.text}}>{lv.name}</div><div className="ssub" style={{color:lv.sub}}>{lv.sceneSub}</div></div>
     <div className="sicon">{lv.icon}</div>
    </div>
    {!isNN&&<div className="qdots">{lv.questions.map((_,i)=><div key={i} className={"qdot"+(i<qi?" done":i===qi?" active":"")}/>)}</div>}
    {isNN?(
     <NeuralGame ac={lv.ac} acd={lv.acd}
      onWin={()=>{stopT();advLv();}}
      onLoseLife={()=>{if(!deadRef.current)loseLife();}}
     />
    ):(
     <div className={"qcard"+(cs?" "+cs:"")} style={{borderColor:cs?"":lv.ac+"18"}}>
      <span className="qtag">{q.tag}</span>
      <span className="qem">{q.emoji}</span>
      <div className="qtxt">{q.question}</div>
      {q.type==="scramble"&&<div className="tiles">{q.tiles.map((l,i)=><div key={i} className="tile" style={{background:TC[i%TC.length],animationDelay:i*.05+"s"}}>{l}</div>)}</div>}
      {q.type==="mcq"&&<div className="opts">{q.options.map((o,i)=>(
       <button key={i} className={"obtn"+(sel===i?" sel":"")} style={sel===i?{borderColor:lv.ac,background:lv.ac+"12",boxShadow:"0 2px 0 "+lv.acd}:{}} onClick={()=>setSel(i)}>
        <div className="oltr" style={sel===i?{background:lv.ac,color:"#fff"}:{}}>{OPTS[i]}</div>{o}
       </button>
      ))}</div>}
      {(q.type==="fill"||q.type==="scramble")&&<input className="finp" type="text" placeholder="Type your answer..." value={inp} onChange={e=>setInp(e.target.value)} onKeyDown={e=>e.key==="Enter"&&canSub&&check()} style={inp?{borderColor:lv.ac}:{}} autoComplete="off" spellCheck={false}/>}
     </div>
    )}
    {toMsg&&<div className="tobar"><span>⏰</span><span><strong>Times up!</strong> You lose a heart. Here is a hint...</span></div>}
    {hint&&!isNN&&<div className="hintbar"><span>💡</span><div style={{lineHeight:1.5}}>{q.hint}</div></div>}
    {!isNN&&<button className="bsub" disabled={!canSub||!!cs} onClick={check} style={canSub&&!cs?{background:lv.ac,boxShadow:"0 5px 0 "+lv.acd}:{}}>
     {cs==="correct"?"✅ Correct!":cs==="wrong"?"❌ Try again!":cs==="timeout"?"⏰ Times up!":"Submit Answer →"}
    </button>}
   </div>
  </div>
 );
}

/* ─── APP ─── */
function App(){
 const [screen,setScreen]=useState("login");
 const [player,setPlayer]=useState(null);
 const [result,setResult]=useState(null);
 const handleComplete=async(timeTaken,livesLeft)=>{
  setResult({timeTaken,livesLeft});setScreen("complete");
  await dbPush({name:player.name,email:player.email,empId:player.empId,timeTaken,livesLeft,ts:Date.now()});
 };
 return(
  screen==="login"?<LoginScreen onLogin={(n,e,id)=>{setPlayer({name:n,email:e,empId:id});setScreen("start")}}/>:
  screen==="start"?<StartScreen player={player} onStart={()=>setScreen("game")}/>:
  screen==="game"?<GameScreen player={player} onComplete={handleComplete} onGameOver={()=>setScreen("login")}/>:
  <CompleteScreen player={player} timeTaken={result.timeTaken} livesLeft={result.livesLeft} onRestart={()=>{setResult(null);setScreen("login")}}/>
 );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
