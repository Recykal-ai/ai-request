function buildGameLevels(){
  return RAW_LEVELS.map((lv,i)=>{
    if(lv.type==="neural")return lv;
    const pi=POOL_IDX[i];
    const pool=POOLS[pi];
    const chosen=shuffle([...pool]).slice(0,2).map(q=>{
      const tilesShuffle=q.type==="scramble"?{tiles:shuffle([...q.tiles])}:{};
      if(q.type!=="mcq")return{...q,...tilesShuffle};
      const idxs=shuffle([0,1,2,3]);
      return{...q,options:idxs.map(j=>q.options[j]),ci:idxs.indexOf(q.ci)};
    });
    return{...lv,questions:chosen};
  });
}

/* ─── NEURAL NETWORK GAME ─── */
function NeuralGame({onWin,onLoseLife,ac,acd}){
  const [pairs] = useState(()=>{
    const chosen=NN_POOL[Math.floor(Math.random()*NN_POOL.length)];
    return shuffle([...chosen]);
  });
  const [rightOrder] = useState(()=>shuffle([0,1,2,3]));
  const [selected,setSelected] = useState(null);
  const [correct,setCorrect] = useState({});
  const [flash,setFlash] = useState(null);
  const [wrongLeft,setWrongLeft] = useState(null);

  const W=560,H=310,LX=110,RX=450,MX=280;
  const NH=54,NG=14;
  const totalH=4*NH+3*NG;
  const topOff=(H-totalH)/2;
  const NY=i=>topOff+i*(NH+NG)+NH/2;

  const makePath=(li,ri)=>{
    const ly=NY(li),ry=NY(ri);
    return "M "+LX+" "+ly+" C "+(MX-50)+" "+ly+" "+(MX+50)+" "+ry+" "+RX+" "+ry;
  };

  const clickLeft=(i)=>{
    if(correct[i]!==undefined)return;
    setSelected(s=>s===i?null:i);
  };

  const clickRight=(pos)=>{
    if(selected===null)return;
    const ok=rightOrder[pos]===selected;
    if(ok){
      const nc={...correct,[selected]:pos};
      setCorrect(nc);
      setFlash({li:selected,ri:pos,ok:true});
      setSelected(null);
      setTimeout(()=>setFlash(null),600);
      if(Object.keys(nc).length===4){setTimeout(()=>onWin(),700);}
    }else{
      setWrongLeft(selected);
      setFlash({li:selected,ri:pos,ok:false});
      setSelected(null);
      onLoseLife();
      setTimeout(()=>{setFlash(null);setWrongLeft(null);},700);
    }
  };

  return(
    <div className="nn-card">
      <div className="nn-head">🔗 Neural Network Challenge</div>
      <div className="nn-sub">Tap an expression on the left, then tap its correct answer on the right</div>
      <svg
        viewBox={"0 0 "+W+" "+H}
        style={{width:"100%",height:"auto",display:"block"}}
        onClick={e=>e.stopPropagation()}
      >
        {/* hidden layer dots */}
        {[H*.25,H*.5,H*.75].map((y,i)=>(
          <circle key={i} cx={MX} cy={y} r={8} fill="#E8DDD6" opacity={0.65}/>
        ))}
        {/* faint mesh lines to hidden layer */}
        {[0,1,2,3].map(li=>[0,1,2].map(mi=>(
          <path key={li+"-"+mi}
            d={"M "+LX+" "+NY(li)+" Q "+MX+" "+((NY(li)+H*(.25+mi*.25))/2)+" "+MX+" "+H*(.25+mi*.25)}
            stroke="#F2EDE8" strokeWidth={1} fill="none"/>
        )))}
        {/* correct connections */}
        {Object.entries(correct).map(([li2,rpos])=>(
          <path key={"conn"+li2}
            d={makePath(parseInt(li2),rpos)}
            stroke="#52C788" strokeWidth={3} fill="none" strokeLinecap="round"
            strokeDasharray={400} strokeDashoffset={0}
            style={{animation:"lineIn .4s ease"}}/>
        ))}
        {/* flash line */}
        {flash&&(
          <path d={makePath(flash.li,flash.ri)}
            stroke={flash.ok?"#52C788":"#FF8A80"}
            strokeWidth={3} fill="none" strokeLinecap="round"/>
        )}
        {/* LEFT nodes — clickable rect */}
        {pairs.map((p,i)=>{
          const y=NY(i);
          const isDone=correct[i]!==undefined;
          const isSel=selected===i;
          const isWrong=wrongLeft===i;
          const fill=isDone?"#A8E6CF":isSel?ac:isWrong?"#FFD0D0":"#FAF6F2";
          const stroke=isDone?"#52C788":isSel?acd:isWrong?"#FF8A80":"#E8DDD6";
          return(
            <g key={"L"+i}>
              <rect
                x={LX-95} y={y-NH/2} width={190} height={NH} rx={14}
                fill={fill} stroke={stroke} strokeWidth={isSel?3:2}
                style={{cursor:isDone?"default":"pointer"}}
                onClick={()=>clickLeft(i)}
              />
              <text x={LX} y={y+7} textAnchor="middle"
                fontFamily="Cooper Black, Lilita One, serif"
                fontSize={17} fill={isDone?"#1A5C38":isSel?"white":"#2D1E0F"}
                style={{pointerEvents:"none",fontWeight:900,userSelect:"none"}}>
                {p.expr}
              </text>
            </g>
          );
        })}
        {/* RIGHT nodes — clickable rect */}
        {rightOrder.map((pairIdx,pos)=>{
          const y=NY(pos);
          const isDone=Object.values(correct).includes(pos);
          return(
            <g key={"R"+pos}>
              <rect
                x={RX-46} y={y-NH/2} width={92} height={NH} rx={14}
                fill={isDone?"#A8E6CF":"#FAF6F2"}
                stroke={isDone?"#52C788":"#E8DDD6"} strokeWidth={2}
                style={{cursor:isDone?"default":"pointer"}}
                onClick={()=>clickRight(pos)}
              />
              <text x={RX} y={y+8} textAnchor="middle"
                fontFamily="Cooper Black, Lilita One, serif"
                fontSize={20} fill={isDone?"#1A5C38":"#2D1E0F"}
                style={{pointerEvents:"none",fontWeight:900,userSelect:"none"}}>
                {pairs[pairIdx].ans}
              </text>
            </g>
          );
        })}
        {/* selected dot indicator */}
        {selected!==null&&(
          <circle cx={LX+97} cy={NY(selected)} r={6} fill={ac} opacity={0.9}
            style={{pointerEvents:"none"}}/>
        )}
      </svg>
      <div className="nn-status">
        {Object.keys(correct).length}/4 connected
        {selected!==null?" — now tap an answer on the right":"  — tap an expression to begin"}
      </div>
    </div>
  );
}

/* ─── LEADERBOARD ─── */
function Leaderboard({myName,myEmpId,myTime}){
  const [rows,setRows]=useState(null);
  const [loading,setLoading]=useState(true);
  const [myRank,setMyRank]=useState(null);
  const [err,setErr]=useState(null);

  const load=useCallback(async()=>{
    setLoading(true);setErr(null);
    const raw=await dbRead();
    if(raw&&typeof raw==="object"){
      const arr=Object.values(raw).sort((a,b)=>a.timeTaken-b.timeTaken);
      setRows(arr);
      const idx=arr.findIndex(r=>r.name===myName&&r.empId===myEmpId&&Math.abs(r.timeTaken-myTime)<10000);
      if(idx>=0)setMyRank(idx+1);
    }else{setErr("Could not load scores. Check Firebase config.")}
    setLoading(false);
  },[myName,myEmpId,myTime]);

  useEffect(()=>{const t=setTimeout(load,2000);const id=setInterval(load,15000);return()=>{clearTimeout(t);clearInterval(id)}},[]);

  if(!DB_ON)return(
    <div className="lb-cfg">
      <b>Enable Live Leaderboard</b>
      Open this HTML file in Notepad, find lines 7-8 at the very top, and replace YOUR-PROJECT and YOUR_API_KEY with your Firebase values. Save and re-upload to GitHub.
    </div>
  );
  return(
    <div className="lb-section">
      <div className="lb-hdr">
        <div className="lb-htitle">🏆 Leaderboard</div>
        <button className={"lb-btn"+(loading?" spinning":"")} onClick={load}>
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
          </svg>
          {loading?"Loading...":"Refresh"}
        </button>
      </div>
      {myRank&&(
        <div className="rank-badge">
          You placed <span className="rank-num">#{myRank}</span>
          {myRank===1?"🥇":myRank===2?"🥈":myRank===3?"🥉":"🎉"}
        </div>
      )}
      {err&&<div className="lb-empty" style={{color:"#E85757"}}>{err}</div>}
      {!err&&(!rows||rows.length===0)?(
        <div className="lb-empty">{loading?"Loading scores...":"No scores yet — you could be first!"}</div>
      ):rows&&rows.slice(0,12).map((r,i)=>{
        const isMe=r.name===myName&&r.empId===myEmpId&&Math.abs(r.timeTaken-myTime)<10000;
        const cls=isMe?"me":i===0?"top1":i===1?"top2":i===2?"top3":"other";
        return(
          <div key={i} className={"lb-row "+cls} style={{animationDelay:i*.05+"s"}}>
            <div className="lb-rank">{i<3?MEDALS[i]:i+1}</div>
            <div className="lb-info">
              <div className="lb-name">{r.name}{isMe&&<span className="me-tag">YOU</span>}</div>
              <div className="lb-emp">{r.empId}</div>
            </div>
            <div style={{textAlign:"right"}}>
              <div className="lb-time" style={{color:i===0?"#B8860B":i===1?"#888":i===2?"#C04A20":"#A0917F"}}>
                ⏱️ {fmtMs(r.timeTaken)}
              </div>
              <div className="lb-lives">{"❤️".repeat(r.livesLeft)}{"🖤".repeat(3-r.livesLeft)}</div>
            </div>
          </div>
        );
      })}
    </div>
  );
}

function Banner({sub}){
  return(
    <div className="top-banner">
      <img src={LOGO_SRC} alt="Recykal" className="recykal-logo"/>
      <span className="banner-tag">{sub||"Tech Day 2025"}</span>
    </div>
  );
}

function LoginScreen({onLogin}){
  const [name,setName]=useState("");const [email,setEmail]=useState("");const [empId,setEmpId]=useState("");
  const ok=name.trim().length>1&&email.includes("@")&&empId.trim().length>0;
  const go=()=>ok&&onLogin(name.trim(),email.trim(),empId.trim());
  return(
    <div className="screen light-screen">
      <div className="bg-blobs"><div className="bg-blob bb1"/><div className="bg-blob bb2"/><div className="bg-blob bb3"/></div>
      <Banner/>
      <div className="login-card">
        <div style={{fontSize:"4rem",marginBottom:8,animation:"float 3s ease-in-out infinite"}}>🤖</div>
        <h1 className="gtitle"><span className="tai">AI </span>Quest</h1>
        <p className="lsub">Escape the office. Prove you know AI! 🏃</p>
        <div className="fg"><label className="fl">Full Name</label><input className="fi" type="text" placeholder="e.g. Priya Sharma" value={name} onChange={e=>setName(e.target.value)}/></div>
        <div className="fg"><label className="fl">Work Email</label><input className="fi" type="email" placeholder="you@recykal.com" value={email} onChange={e=>setEmail(e.target.value)}/></div>
        <div className="fg"><label className="fl">Employee ID</label><input className="fi" type="text" placeholder="e.g. RCY-1042" value={empId} onChange={e=>setEmpId(e.target.value)} onKeyDown={e=>e.key==="Enter"&&go()}/></div>
        <button className="btn btn-blue" disabled={!ok} onClick={go}>Lets Go!</button>
      </div>
    </div>
  );
}

function StartScreen({player,onStart}){
  return(
    <div className="screen light-screen">
      <div className="bg-blobs"><div className="bg-blob bb1"/><div className="bg-blob bb2"/><div className="bg-blob bb3"/></div>
      <Banner/>
      <div className="start-card">
        <div style={{fontSize:"4rem",marginBottom:8,animation:"float 3s ease-in-out infinite"}}>🤖</div>
        <h1 className="gtitle"><span className="tai">AI </span>Quest</h1>
        <p className="lsub">Escape the office. Prove you know AI! 🏃</p>
        <div className="wpill">Hey <span>{player.name}</span>! Ready to show what you know? 👋</div>
        <div className="rules-grid">
          <div className="rc"><span className="re">🏢</span><div className="rt"><strong>5 Levels</strong>Desk, Break Room, Neural Net, Meeting, Exit</div></div>
          <div className="rc"><span className="re">⏱️</span><div className="rt"><strong>Fast Timers!</strong>30s → 25s → 20s → 16s → 12s each level!</div></div>
          <div className="rc"><span className="re">❤️</span><div className="rt"><strong>3 Lives Only</strong>Lose all 3 and the game ends — no restart!</div></div>
          <div className="rc"><span className="re">🏆</span><div className="rt"><strong>Live Leaderboard</strong>See your rank the second you finish!</div></div>
        </div>
        <button className="btn btn-blue" onClick={onStart}>START PLAYING →</button>
      </div>
    </div>
  );
}

function CompleteScreen({player,timeTaken,livesLeft,onRestart}){
  return(
    <div className="screen complete-screen">
      <Confetti/>
      <div className="bg-blobs"><div className="bg-blob bb1"/><div className="bg-blob bb2"/><div className="bg-blob bb3"/></div>
      <Banner/>
      <div className="complete-card">
        <span className="trophy">🏆</span>
        <h2 className="ctitle">You Escaped!</h2>
        <p className="csub">All 5 levels crushed! Great work 🎉</p>
        <div className="stats-row">
          <div className="sbox"><div className="sval">⏱️ {fmtMs(timeTaken)}</div><div className="skey">Your Time</div></div>
          <div className="sbox"><div className="sval">{"❤️".repeat(livesLeft)}{"🖤".repeat(3-livesLeft)}</div><div className="skey">Lives Left</div></div>
        </div>
        <Leaderboard myName={player.name} myEmpId={player.empId} myTime={timeTaken}/>
        <button className="btn-restart" onClick={onRestart}>↩ Play again</button>
      </div>
    </div>
  );
}

/* ─── GAME SCREEN ─── */
function GameScreen({player,onComplete,onGameOver}){
  const [LEVELS]=useState(()=>buildGameLevels());
  const [li,setLi]=useState(0);const [qi,setQi]=useState(0);
  const [lives,setLives]=useState(3);const [hint,setHint]=useState(false);
  const [toMsg,setToMsg]=useState(false);const [sel,setSel]=useState(null);
  const [inp,setInp]=useState("");const [cs,setCs]=useState(null);
  const [trans,setTrans]=useState(null);const [burst,setBurst]=useState(false);
  const [hb,setHb]=useState(-1);const [tkey,setTkey]=useState(0);
  const [tLeft,setTLeft]=useState(TIMERS[0]);const [tRun,setTRun]=useState(true);
  const [dead,setDead]=useState(false);
  const t0=useRef(Date.now());const iRef=useRef(null);

  const lv=LEVELS[li];const isNeural=lv.type==="neural";
  const q=isNeural?null:lv.questions[qi];const ts=TIMERS[li];
  const canSub=!isNeural&&(q.type==="mcq"?sel!==null:inp.trim().length>0);

  const stopT=()=>{clearInterval(iRef.current);setTRun(false)};
  const startT=(s)=>{clearInterval(iRef.current);setTLeft(s);setTRun(true)};

  const triggerDead=useCallback(()=>{stopT();setTimeout(()=>setDead(true),500);},[]);

  const loseOneLife=useCallback((currentLives)=>{
    const nl=Math.max(0,currentLives-1);
    setHb(nl);
    if(nl===0){triggerDead();return nl;}
    return nl;
  },[triggerDead]);

  const handleTO=useCallback(()=>{
    setCs("timeout");setToMsg(true);setHint(true);
    setLives(l=>{
      const nl=loseOneLife(l);
      if(nl>0){
        setTimeout(()=>{setHb(-1);setCs(null);setSel(null);setInp("");setToMsg(false);setTkey(k=>k+1);startT(TIMERS[li])},1200);
      }
      return nl;
    });
  },[li,loseOneLife]);

  useEffect(()=>{
    if(!tRun||trans||cs||isNeural||dead)return;
    iRef.current=setInterval(()=>{setTLeft(t=>{if(t<=1){clearInterval(iRef.current);handleTO();return 0}return t-1})},1000);
    return()=>clearInterval(iRef.current);
  },[tRun,trans,cs,tkey,isNeural,dead]);

  const advanceLevel=useCallback(()=>{
    if(li===LEVELS.length-1){onComplete(Date.now()-t0.current,lives);}
    else{
      const nl=li+1;
      setTrans({msg:"Level "+(li+1)+" Complete!",sub:"Moving to "+LEVELS[nl].name+"...",icon:LEVELS[nl].icon,note:"Timer: "+TIMERS[nl]+"s next level",bg:LEVELS[nl].bg,text:LEVELS[nl].text});
      setTimeout(()=>{setTrans(null);setLi(nl);setQi(0);setHint(false);setTkey(k=>k+1);startT(TIMERS[nl])},950);
    }
  },[li,lives,LEVELS]);

  const advance=useCallback(()=>{
    if(isNeural||qi===1){advanceLevel();}else{setQi(1);setTkey(k=>k+1);startT(ts);}
  },[isNeural,qi,ts,advanceLevel]);

  const check=()=>{
    if(cs)return;
    const ok=q.type==="mcq"?sel===q.ci:inp.trim().toLowerCase()===q.answer.toLowerCase();
    if(ok){
      stopT();setCs("correct");setBurst(true);
      setTimeout(()=>setBurst(false),400);
      setTimeout(()=>{setCs(null);setHint(false);setToMsg(false);setSel(null);setInp("");advance()},450);
    }else{
      stopT();setCs("wrong");
      setLives(l=>{
        const nl=loseOneLife(l);
        setHint(true);
        if(nl>0){setTimeout(()=>{setHb(-1);setCs(null);setSel(null);setInp("");setTkey(k=>k+1);startT(ts)},900);}
        return nl;
      });
    }
  };

  const pct=(tLeft/ts)*100,tst=tLeft>ts*.5?"ok":tLeft>ts*.2?"warn":"danger",tcol=tLeft>ts*.5?lv.ac:tLeft>ts*.2?"#E8A23C":"#E85757";

  return(
    <div className="screen game-screen" style={{background:lv.bg,paddingTop:56}}>
      <Banner sub={lv.name}/>

      {/* GAME OVER */}
      {dead&&(
        <div className="gameover-ovl">
          <div style={{fontSize:"5rem",marginBottom:12}}>💔</div>
          <div style={{fontFamily:"var(--font-d)",fontSize:"2.2rem",color:"#6E2A0A",marginBottom:6}}>Game Over!</div>
          <div style={{fontSize:".95rem",color:"#B36040",marginBottom:8}}>You used all 3 lives.</div>
          <div style={{fontSize:".85rem",color:"#B36040",marginBottom:22}}>Time: {fmtMs(Date.now()-t0.current)}</div>
          <button className="btn btn-red" style={{width:"auto",padding:"13px 44px"}} onClick={onGameOver}>Try Again 🔄</button>
        </div>
      )}

      {/* LEVEL TRANSITION */}
      {trans&&!dead&&(
        <div className="tovl" style={{background:trans.bg}}>
          <div style={{fontSize:"5rem",marginBottom:12,animation:"float 1s ease-in-out infinite"}}>{trans.icon}</div>
          <div className="ttitle" style={{color:trans.text}}>{trans.msg}</div>
          <div className="tsub" style={{color:trans.text}}>{trans.sub}</div>
          <div className="tnote" style={{color:trans.text}}>{trans.note}</div>
        </div>
      )}

      {burst&&<div className="covl"><div className="cburst">✅</div></div>}

      <div className="gw" key={li+"-"+qi}>
        <div className="ghdr">
          <div className="lbadge" style={{borderColor:lv.ac,color:lv.text}}>Level {li+1}/5 — {lv.name}</div>
          <div className="lvs">{[0,1,2].map(i=><span key={i} className={"hrt"+(i>=lives?" lost":"")+(hb===i?" beat":"")}>❤️</span>)}</div>
        </div>
        {!isNeural&&(
          <div className="trow">
            <div className={"tnum "+tst}>{tLeft}s</div>
            <div className="tbw"><div className="tbf" style={{width:pct+"%",background:tcol}}/></div>
            <div className="tlbl">time left</div>
          </div>
        )}
        <div className="ptrow">
          <div className="pbw"><div className="pbf" style={{width:((li*2+qi)/10*100)+"%",background:lv.ac}}/></div>
          <span className="plbl">{li*2+qi}/10</span>
        </div>
        <div className="lscene" style={{background:lv.bg,boxShadow:"0 4px 20px "+lv.ac+"28"}}>
          <div className="sdeco">{lv.deco}</div>
          <div>
            <div className="stitle" style={{color:lv.text}}>{lv.name}</div>
            <div className="ssub" style={{color:lv.sub}}>{lv.sceneSub}</div>
          </div>
          <div className="sicon">{lv.icon}</div>
        </div>
        {!isNeural&&<div className="qdots">{lv.questions.map((_,i)=><div key={i} className={"qdot"+(i<qi?" done":i===qi?" active":"")}/>)}</div>}
        {isNeural?(
          <NeuralGame
            ac={lv.ac} acd={lv.acd}
            onWin={()=>{stopT();advanceLevel();}}
            onLoseLife={()=>{setLives(l=>{const nl=loseOneLife(l);return nl;});}}
          />
        ):(
          <div className={"qcard"+(cs?" "+cs:"")} style={{borderColor:cs?"":lv.ac+"18"}}>
            <span className="qtag">{q.tag}</span>
            <span className="qem">{q.emoji}</span>
            <div className="qtxt">{q.question}</div>
            {q.type==="scramble"&&<div className="stiles">{q.tiles.map((l,i)=><div key={i} className="stile" style={{background:TC[i%TC.length],animationDelay:i*.05+"s"}}>{l}</div>)}</div>}
            {q.type==="mcq"&&<div className="opts">{q.options.map((o,i)=>(
              <button key={i} className={"obtn"+(sel===i?" sel":"")}
                style={sel===i?{borderColor:lv.ac,background:lv.ac+"12",boxShadow:"0 2px 0 "+lv.acd}:{}}
                onClick={()=>setSel(i)}>
                <div className="oltr" style={sel===i?{background:lv.ac,color:"#fff"}:{}}>{OPTS[i]}</div>{o}
              </button>
            ))}</div>}
            {(q.type==="fill"||q.type==="scramble")&&<input className="finp" type="text" placeholder="Type your answer..." value={inp} onChange={e=>setInp(e.target.value)} onKeyDown={e=>e.key==="Enter"&&canSub&&check()} style={inp?{borderColor:lv.ac}:{}} autoComplete="off" spellCheck={false}/>}
          </div>
        )}
        {toMsg&&<div className="tobar"><span>⏰</span><span><strong>Times up!</strong> You lose a heart. Here is a hint...</span></div>}
        {hint&&!isNeural&&<div className="hintbar"><span>💡</span><span><strong>Hint:</strong> {q.hint}</span></div>}
        {!isNeural&&<button className="bsub" disabled={!canSub||!!cs} onClick={check}
          style={canSub&&!cs?{background:lv.ac,boxShadow:"0 5px 0 "+lv.acd}:{}}>
          {cs==="correct"?"✅ Correct!":cs==="wrong"?"❌ Try again!":cs==="timeout"?"⏰ Times up!":"Submit Answer →"}
        </button>}
      </div>
    </div>
  );
}

/* ─── APP ─── */
function App(){
  const [screen,setScreen]=useState("login");
  const [player,setPlayer]=useState(null);
  const [result,setResult]=useState(null);

  const handleComplete=async(timeTaken,livesLeft)=>{
    setResult({timeTaken,livesLeft});
    setScreen("complete");
    await dbPush({name:player.name,email:player.email,empId:player.empId,timeTaken,livesLeft,ts:Date.now()});
  };

  return(
    screen==="login"?<LoginScreen onLogin={(n,e,id)=>{setPlayer({name:n,email:e,empId:id});setScreen("start")}}/>:
    screen==="start"?<StartScreen player={player} onStart={()=>setScreen("game")}/>:
    screen==="game"?<GameScreen player={player} onComplete={handleComplete} onGameOver={()=>setScreen("login")}/>:
    <CompleteScreen player={player} timeTaken={result.timeTaken} livesLeft={result.livesLeft} onRestart={()=>{setResult(null);setScreen("login")}}/>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
