function Leaderboard({myCode}){
  const [rows,setRows]=useState(null);const [loading,setLoading]=useState(false);
  const load=useCallback(async()=>{setLoading(true);const raw=await dbRead();if(raw){setRows(Object.values(raw).sort((a,b)=>a.timeTaken-b.timeTaken))}setLoading(false)},[]);
  useEffect(()=>{load();const id=setInterval(load,15000);return()=>clearInterval(id)},[]);
  if(!DB_ON)return(<div>
    <div className="lb-setup">
      <div className="lb-setup-title">Enable Live Leaderboard</div>
      <div className="lb-setup-step"><span>1.</span>Go to firebase.google.com and create a new project</div>
      <div className="lb-setup-step"><span>2.</span>Build → Realtime Database → Create → Test mode</div>
      <div className="lb-setup-step"><span>3.</span>Project Settings → Web app → copy config values</div>
      <div className="lb-setup-step"><span>4.</span>Open this HTML file and paste DB URL and API key at the top</div>
    </div>
    <div className="lb-empty"><span className="lb-empty-icon">📊</span><div style={{fontWeight:700,fontSize:".8rem"}}>Leaderboard not configured yet</div></div>
  </div>);
  return(<div className="lb-wrap">
    <div className="lb-header">
      <div className="lb-title">🏆 Live Leaderboard</div>
      <button className={"lb-refresh"+(loading?" spinning":"")} onClick={load}>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        {loading?"Refreshing...":"Refresh"}
      </button>
    </div>
    {!rows||rows.length===0?(
      <div className="lb-empty"><span className="lb-empty-icon">{loading?"⏳":"🎮"}</span><div style={{fontWeight:700,fontSize:".8rem"}}>{loading?"Loading...":"No scores yet — be first!"}</div></div>
    ):rows.slice(0,15).map((r,i)=>{
      const isMe=r.code===myCode,cls=isMe?"me":i===0?"top1":i===1?"top2":i===2?"top3":"other";
      return(<div key={i} className={"lb-row "+cls} style={{animationDelay:i*.06+"s"}}>
        <div className="lb-rank">{i<3?MEDALS[i]:i+1}</div>
        <div className="lb-info"><div className="lb-name">{r.name}{isMe&&<span className="lb-me-tag">YOU</span>}</div><div className="lb-empid">{r.empId}</div></div>
        <div style={{textAlign:"right"}}>
          <div className="lb-time" style={{color:i===0?"#B8860B":i===1?"#888":i===2?"#C04A20":"#A0917F"}}>⏱️ {fmtMs(r.timeTaken)}</div>
          <div className="lb-lives">{"❤️".repeat(r.livesLeft)}{"🖤".repeat(3-r.livesLeft)}</div>
        </div>
      </div>);
    })}
  </div>);
}

function CompleteScreen({player,code,timeTaken,livesLeft,onRestart}){
  const [tab,setTab]=useState("result");const [copied,setCopied]=useState(false);
  const copy=()=>{navigator.clipboard&&navigator.clipboard.writeText(code);setCopied(true);setTimeout(()=>setCopied(false),2000)};
  return(<div className="screen complete-screen">

      </div>
      {tab==="result"&&<>
        <div className="srow">
          <div className="sbox"><div className="sval">⏱️ {fmtMs(timeTaken)}</div><div className="skey">Total Time</div></div>
          <div className="sbox"><div className="sval">{"❤️".repeat(livesLeft)}{"🖤".repeat(3-livesLeft)}</div><div className="skey">Lives Left</div></div>
        </div>
        <div className="codesec">
          <div className="codel">Your Completion Code</div>
          <button className="codev" onClick={copy}>{code}</button>
          <div className="codeh">{copied?"✅ Copied!":"👆 Tap to copy"}</div>
        </div>
        <div className="steps">
          <div className="shead">What to do next</div>
          <div className="si"><div className="sn">1</div><div>Copy your code: <strong style={{color:"#3A8FBF"}}>{code}</strong></div></div>
          <div className="si"><div className="sn">2</div><div>Open the Google Form on Slack or the event board</div></div>
          <div className="si"><div className="sn">3</div><div>Submit your Name, Employee ID and this code</div></div>
          <div className="si"><div className="sn">4</div><div>Check the Leaderboard tab to see your rank! 🚀</div></div>
        </div>
      </>}
      {tab==="lb"&&<Leaderboard myCode={code}/>}
      <button className="btn-restart" onClick={onRestart}>↩ Play again</button>
    </div>
  </div>);
}

function GameScreen({player,onComplete}){
  const [li,setLi]=useState(0);const [qi,setQi]=useState(0);const [lives,setLives]=useState(3);
  const [hint,setHint]=useState(false);const [toMsg,setToMsg]=useState(false);
  const [sel,setSel]=useState(null);const [inp,setInp]=useState("");const [cs,setCs]=useState(null);
  const [trans,setTrans]=useState(null);const [burst,setBurst]=useState(false);
  const [hb,setHb]=useState(-1);const [tkey,setTkey]=useState(0);
  const [tLeft,setTLeft]=useState(TIMERS[0]);const [tRun,setTRun]=useState(true);
  const t0=useRef(Date.now());const iRef=useRef(null);
  const lv=LEVELS[li];const q=lv.questions[qi];const ts=TIMERS[li];
  const canSub=q.type==="mcq"?sel!==null:inp.trim().length>0;
  const stopT=()=>{clearInterval(iRef.current);setTRun(false)};
  const startT=(s)=>{clearInterval(iRef.current);setTLeft(s);setTRun(true)};
  const handleTO=useCallback(()=>{
    setCs("timeout");setToMsg(true);setHint(true);
    setLives(l=>{const nl=Math.max(0,l-1);setHb(nl);
      setTimeout(()=>{setHb(-1);setCs(null);setSel(null);setInp("");setToMsg(false);if(nl===0)setLives(3);setTkey(k=>k+1);startT(TIMERS[li])},1400);
      return nl});
  },[li]);
  useEffect(()=>{
    if(!tRun||trans||cs)return;
    iRef.current=setInterval(()=>{setTLeft(t=>{if(t<=1){clearInterval(iRef.current);handleTO();return 0}return t-1})},1000);
    return()=>clearInterval(iRef.current);
  },[tRun,trans,cs,tkey]);
  const advance=()=>{
    if(qi===0){setQi(1);setTkey(k=>k+1);startT(ts)}
    else if(li===LEVELS.length-1){onComplete(Date.now()-t0.current,lives)}
    else{
      const nl=li+1;
      setTrans({msg:"Level "+(li+1)+" Complete!",sub:"Moving to "+LEVELS[nl].name+"...",icon:LEVELS[nl].icon,note:"Timer drops to "+TIMERS[nl]+"s next!",bg:LEVELS[nl].bg,text:LEVELS[nl].text});
      setTimeout(()=>{setTrans(null);setLi(nl);setQi(0);setHint(false);setTkey(k=>k+1);startT(TIMERS[nl])},2200);
    }
  };
  const check=()=>{
    if(cs)return;
    const ok=q.type==="mcq"?sel===q.ci:inp.trim().toLowerCase()===q.answer.toLowerCase();
    if(ok){stopT();setCs("correct");setBurst(true);setTimeout(()=>setBurst(false),900);setTimeout(()=>{setCs(null);setHint(false);setToMsg(false);setSel(null);setInp("");advance()},900)}
    else{stopT();setCs("wrong");setLives(l=>{const nl=Math.max(0,l-1);setHb(nl);setHint(true);setTimeout(()=>{setHb(-1);setCs(null);setSel(null);setInp("");if(nl===0)setLives(3);setTkey(k=>k+1);startT(ts)},1000);return nl})}
  };
  const pct=(tLeft/ts)*100,tst=tLeft>ts*.5?"ok":tLeft>ts*.2?"warn":"danger",tcol=tLeft>ts*.5?lv.ac:tLeft>ts*.2?"#E8A23C":"#E85757";
  const blobColors=["#FFD166","#A8E6CF","#FFB3B3","#C9B8E8","#B3D9FF"];
  return(<div className="screen game-screen" style={{background:lv.bg,paddingTop:58}}>
    <Banner sub={lv.name}/>
    {trans&&<div className="tovl" style={{background:trans.bg}}>
      <div className="tbig">{trans.icon}</div>
      <div className="ttitle" style={{color:trans.text}}>{trans.msg}</div>
      <div className="tsub" style={{color:trans.text}}>{trans.sub}</div>
      <div className="tnote" style={{color:trans.text}}>{trans.note}</div>
    </div>}
    {burst&&<div className="covl"><div className="cburst">✅</div></div>}
    <div className="gw" key={li+"-"+qi}>
      <div className="ghdr">
        <div className="lbadge" style={{borderColor:lv.ac,color:lv.text}}>Level {li+1}/5 — {lv.name}</div>
        <div className="lvs">{[0,1,2].map(i=><span key={i} className={"hrt"+(i>=lives?" lost":"")+(hb===i?" beat":"")}>❤️</span>)}</div>
      </div>
      <div className="trow">
        <div className={"tnum "+tst}>{tLeft}s</div>
        <div className="tbw"><div className="tbf" style={{width:pct+"%",background:tcol}}/></div>
        <div className="tlbl">time left</div>
      </div>
      <div className="ptrow">
        <div className="pbw"><div className="pbf" style={{width:((li*2+qi)/10*100)+"%",background:lv.ac}}/></div>
        <span className="plbl">{li*2+qi}/10</span>
      </div>
      <div className="lscene" style={{background:lv.bg,boxShadow:"0 4px 20px "+lv.ac+"28"}}>
        <div className="sdeco">{lv.deco}</div>
        <div><div className="stitle" style={{color:lv.text}}>{lv.name}</div><div className="ssub" style={{color:lv.sub}}>{lv.sceneSub}</div></div>
        <div style={{display:"flex",alignItems:"flex-end",gap:6}}>
          <div style={{animation:"float 2.8s ease-in-out infinite"}}><Blob size={60} color={blobColors[li]} levelIdx={li}/></div>
          <div className="sicon">{lv.icon}</div>
        </div>
      </div>
      <div className="qdots">{lv.questions.map((_,i)=><div key={i} className={"qdot"+(i<qi?" done":i===qi?" active":"")}/>)}</div>
      <div className={"qcard"+(cs?" "+cs:"")} style={{borderColor:cs?"":lv.ac+"18"}}>
        <span className="qtag">{q.tag}</span>
        <span className="qem">{q.emoji}</span>
        <div className="qtxt">{q.question}</div>
        {q.type==="scramble"&&<div className="stiles">{q.tiles.map((l,i)=><div key={i} className="stile" style={{background:TCOLS[i%TCOLS.length],animationDelay:i*.05+"s"}}>{l}</div>)}</div>}
        {q.type==="mcq"&&<div className="opts">{q.options.map((o,i)=>(
          <button key={i} className={"obtn"+(sel===i?" sel":"")} style={sel===i?{borderColor:lv.ac,background:lv.ac+"12",boxShadow:"0 2px 0 "+lv.acd}:{}} onClick={()=>setSel(i)}>
            <div className="oltr" style={sel===i?{background:lv.ac,color:"#fff"}:{}}>{OPTS[i]}</div>{o}
          </button>
        ))}</div>}
        {(q.type==="fill"||q.type==="scramble")&&<input className="finp" type="text" placeholder="Type your answer here..." value={inp} onChange={e=>setInp(e.target.value)} onKeyDown={e=>e.key==="Enter"&&canSub&&check()} style={inp?{borderColor:lv.ac}:{}} autoComplete="off" spellCheck={false}/>}
      </div>
      {toMsg&&<div className="tobar"><span>⏰</span><span><strong>Times up!</strong> You lose a heart. Here is a hint...</span></div>}
      {hint&&<div className="hintbar"><span>💡</span><span><strong>Hint:</strong> {q.hint}</span></div>}
      <button className="bsub" disabled={!canSub||!!cs} onClick={check} style={canSub&&!cs?{background:lv.ac,boxShadow:"0 5px 0 "+lv.acd}:{}}>
        {cs==="correct"?"✅ Correct!":cs==="wrong"?"❌ Try again!":cs==="timeout"?"⏰ Times up!":"Submit Answer →"}
      </button>
    </div>
  </div>);
}

function App(){
  const [screen,setScreen]=useState("login");const [player,setPlayer]=useState(null);const [result,setResult]=useState(null);
  const handleComplete=async(timeTaken,livesLeft)=>{const code=genCode(player.name);await dbPush({name:player.name,email:player.email,empId:player.empId,code,timeTaken,livesLeft,ts:Date.now()});setResult({code,timeTaken,livesLeft});setScreen("complete")};
  return screen==="login"?<LoginScreen onLogin={(n,e,id)=>{setPlayer({name:n,email:e,empId:id});setScreen("start")}}/>:
    screen==="start"?<StartScreen player={player} onStart={()=>setScreen("game")}/>:
    screen==="game"?<GameScreen player={player} onComplete={handleComplete}/>:
    <CompleteScreen player={player} code={result.code} timeTaken={result.timeTaken} livesLeft={result.livesLeft} onRestart={()=>{setResult(null);setScreen("login")}}/>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
