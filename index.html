function buildGameLevels(){
  return RAW_LEVELS.map(lv=>{
    if(lv.type==="neural") return lv;
    const shuffledQs=shuffle([...lv.questions]).map(q=>{
      if(q.type!=="mcq") return q;
      const idxs=shuffle([0,1,2,3]);
      return {...q,options:idxs.map(i=>q.options[i]),ci:idxs.indexOf(q.ci)};
    });
    return {...lv,questions:shuffledQs};
  });
}

/* ─── NEURAL NETWORK MINI GAME ─── */
function NeuralGame({onWin,onLoseLife,ac,acd}){
  const [pairs] = useState(()=>shuffle([
    {expr:"3 + 4",ans:"7"},
    {expr:"5 x 3",ans:"15"},
    {expr:"12 - 8",ans:"4"},
    {expr:"18 / 2",ans:"9"}
  ]));
  const [rightOrder] = useState(()=>{const a=shuffle([0,1,2,3]);return a;});
  const [selected,setSelected] = useState(null);
  const [correct,setCorrect] = useState({});
  const [flashLine,setFlashLine] = useState(null);
  const [wrongNode,setWrongNode] = useState(null);
  const W=560,H=300,LX=95,RX=465,MX=280;
  const nodeH=75;
  const ly=i=>37.5+i*nodeH;
  const ry=pos=>37.5+pos*nodeH;
  const handleLeft=(idx)=>{if(correct[idx]!==undefined)return;setSelected(idx);setWrongNode(null);};
  const handleRight=(pos)=>{
    if(selected===null)return;
    const pairAtRight=rightOrder[pos];
    if(pairAtRight===selected){
      const nc={...correct,[selected]:pos};
      setCorrect(nc);
      setFlashLine({left:selected,right:pos,ok:true});
      setSelected(null);
      setTimeout(()=>setFlashLine(null),500);
      if(Object.keys(nc).length===4){setTimeout(()=>onWin(),600);}
    } else {
      setWrongNode(selected);
      setFlashLine({left:selected,right:pos,ok:false});
      setSelected(null);
      onLoseLife();
      setTimeout(()=>{setFlashLine(null);setWrongNode(null);},700);
    }
  };
  const svgPath=(lyi,ryj)=>{const cp1x=MX-40,cp2x=MX+40;return "M "+LX+" "+lyi+" C "+cp1x+" "+lyi+" "+cp2x+" "+ryj+" "+RX+" "+ryj;};
  return(
    <div className="nn-wrap">
      <div className="nn-title">🔗 Neural Network Challenge</div>
      <div className="nn-sub">Connect each expression on the left to its correct answer on the right</div>
      <svg viewBox={"0 0 "+W+" "+H} style={{width:"100%",height:"auto",display:"block",userSelect:"none"}}>
        {/* Middle hidden layer dots */}
        {[75,150,225].map((y,i)=><circle key={i} cx={MX} cy={y} r={9} fill="#E8DDD6" opacity={0.7}/>)}
        {/* Faint connecting mesh from hidden layer */}
        {[75,150,225].map((y,i)=>[0,1,2,3].map(j=><path key={i+"-"+j} d={"M "+LX+" "+ly(j)+" Q "+MX+" "+((ly(j)+y)/2)+" "+MX+" "+y} stroke="#F2EDE8" strokeWidth={1} fill="none"/>))}
        {/* Correct lines */}
        {Object.entries(correct).map(([li2,rpos])=>(
          <path key={"c"+li2} d={svgPath(ly(parseInt(li2)),ry(rpos))} stroke="#52C788" strokeWidth={3} fill="none" strokeLinecap="round" opacity={0.9} strokeDasharray={300} strokeDashoffset={0} style={{animation:"lineGrow .4s ease"}}/>
        ))}
        {/* Flash line */}
        {flashLine&&<path d={svgPath(ly(flashLine.left),ry(flashLine.right))} stroke={flashLine.ok?"#52C788":"#FF8A80"} strokeWidth={3} fill="none" strokeLinecap="round" opacity={0.9}/>}
        {/* Left expression nodes */}
        {pairs.map((p,i)=>{
          const y=ly(i);const isSel=selected===i;const isDone=correct[i]!==undefined;const isWrong=wrongNode===i;
          return(
            <g key={"l"+i} onClick={()=>handleLeft(i)} style={{cursor:isDone?"default":"pointer"}}>
              <rect x={LX-80} y={y-24} width={162} height={48} rx={14}
                fill={isDone?"#A8E6CF":isSel?ac:isWrong?"#FFD0D0":"#FAF6F2"}
                stroke={isDone?"#52C788":isSel?acd:isWrong?"#FF8A80":"#E8DDD6"}
                strokeWidth={isSel?3:2}/>
              <text x={LX-1} y={y+7} textAnchor="middle" fontSize={17} fontWeight="900"
                fontFamily="Cooper Black, Lilita One, serif"
                fill={isDone?"#1A5C38":isSel?"white":"#2D1E0F"}>{p.expr}</text>
            </g>
          );
        })}
        {/* Right answer nodes */}
        {rightOrder.map((pairIdx,pos)=>{
          const y=ry(pos);const isDone=Object.values(correct).includes(pos);
          return(
            <g key={"r"+pos} onClick={()=>handleRight(pos)} style={{cursor:isDone?"default":"pointer"}}>
              <rect x={RX-40} y={y-24} width={82} height={48} rx={14}
                fill={isDone?"#A8E6CF":"#FAF6F2"}
                stroke={isDone?"#52C788":"#E8DDD6"}
                strokeWidth={2}/>
              <text x={RX+1} y={y+7} textAnchor="middle" fontSize={19} fontWeight="900"
                fontFamily="Cooper Black, Lilita One, serif"
                fill={isDone?"#1A5C38":"#2D1E0F"}>{pairs[pairIdx].ans}</text>
            </g>
          );
        })}
        {/* Selected indicator pulse */}
        {selected!==null&&<circle cx={LX} cy={ly(selected)} r={4} fill={ac} opacity={0.8}/>}
      </svg>
      <div style={{textAlign:"center",fontSize:".78rem",color:"#C4B5A8",marginTop:6}}>
        {Object.keys(correct).length}/4 connected
        {selected!==null?" — now tap an answer on the right":"  — tap an expression to start"}
      </div>
    </div>
  );
}

/* ─── LEADERBOARD (on complete screen) ─── */
function Leaderboard({myName,myEmpId,myTime}){
  const [rows,setRows]=useState(null);const [loading,setLoading]=useState(true);const [myRank,setMyRank]=useState(null);
  const load=useCallback(async()=>{
    setLoading(true);
    const raw=await dbRead();
    if(raw){
      const sorted=Object.values(raw).sort((a,b)=>a.timeTaken-b.timeTaken);
      setRows(sorted);
      const idx=sorted.findIndex(r=>r.name===myName&&r.empId===myEmpId&&Math.abs(r.timeTaken-myTime)<8000);
      setMyRank(idx>=0?idx+1:null);
    }
    setLoading(false);
  },[myName,myEmpId,myTime]);
  useEffect(()=>{const t=setTimeout(load,1200);const id=setInterval(load,15000);return()=>{clearTimeout(t);clearInterval(id)}},[]);
  if(!DB_ON)return(<div className="lb-setup"><strong>Enable Live Leaderboard</strong>Open this HTML file, find the top 2 lines and replace YOUR-PROJECT with your Firebase DB URL and API key.</div>);
  return(<div className="lb-section">
    <div className="lb-head">
      <span>🏆 Live Leaderboard</span>
      <button className={"lb-refresh"+(loading?" spinning":"")} onClick={load}>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        {loading?"Loading...":"Refresh"}
      </button>
    </div>
    {myRank&&<div className="rank-badge">You placed <span className="rank-num">#{myRank}</span> {myRank===1?"🥇":myRank===2?"🥈":myRank===3?"🥉":"🎉"}</div>}
    {!rows||rows.length===0?(
      <div style={{textAlign:"center",padding:"20px",color:"#C4B5A8",fontSize:".82rem"}}>{loading?"Loading scores...":"No scores yet!"}</div>
    ):rows.slice(0,12).map((r,i)=>{
      const isMe=r.name===myName&&r.empId===myEmpId&&Math.abs(r.timeTaken-myTime)<8000;
      const cls=isMe?"me":i===0?"top1":i===1?"top2":i===2?"top3":"other";
      return(<div key={i} className={"lb-row "+cls} style={{animationDelay:i*.05+"s"}}>
        <div className="lb-rank">{i<3?MEDALS[i]:i+1}</div>
        <div className="lb-info"><div className="lb-name">{r.name}{isMe&&<span className="lb-me-tag">YOU</span>}</div><div className="lb-empid">{r.empId}</div></div>
        <div style={{textAlign:"right"}}>
          <div className="lb-time" style={{color:i===0?"#B8860B":i===1?"#888":i===2?"#C04A20":"#A0917F"}}>⏱️ {fmtMs(r.timeTaken)}</div>
          <div className="lb-lives">{"❤️".repeat(r.livesLeft)}{"🖤".repeat(3-r.livesLeft)}</div>
        </div>
      </div>);
    })}
  </div>);
}

}

function CompleteScreen({player,timeTaken,livesLeft,onRestart}){
  return(<div className="screen complete-screen">
    <Confetti/>
    <div className="bg-blobs"><div className="bg-blob bb1"/><div className="bg-blob bb2"/><div className="bg-blob bb3"/></div>
    <Banner/>
    <div className="complete-card">
      <span className="trophy">🏆</span>
      <h2 className="ctitle">You Escaped!</h2>
      <div className="stats-row">
        <div className="sbox"><div className="sval">⏱️ {fmtMs(timeTaken)}</div><div className="skey">Your Time</div></div>
        <div className="sbox"><div className="sval">{"❤️".repeat(livesLeft)}{"🖤".repeat(3-livesLeft)}</div><div className="skey">Lives Left</div></div>
      </div>
      <Leaderboard myName={player.name} myEmpId={player.empId} myTime={timeTaken}/>
      <button className="btn-restart" onClick={onRestart}>↩ Play again</button>
    </div>
  </div>);
}

function GameScreen({player,onComplete}){
  const [LEVELS] = useState(()=>buildGameLevels());
  const [li,setLi]=useState(0);const [qi,setQi]=useState(0);const [lives,setLives]=useState(3);
  const [hint,setHint]=useState(false);const [toMsg,setToMsg]=useState(false);
  const [sel,setSel]=useState(null);const [inp,setInp]=useState("");const [cs,setCs]=useState(null);
  const [trans,setTrans]=useState(null);const [burst,setBurst]=useState(false);
  const [hb,setHb]=useState(-1);const [tkey,setTkey]=useState(0);
  const [tLeft,setTLeft]=useState(TIMERS[0]);const [tRun,setTRun]=useState(true);
  const t0=useRef(Date.now());const iRef=useRef(null);
  const lv=LEVELS[li];const isNeural=lv.type==="neural";const q=isNeural?null:lv.questions[qi];const ts=TIMERS[li];
  const canSub=!isNeural&&(q.type==="mcq"?sel!==null:inp.trim().length>0);
  const stopT=()=>{clearInterval(iRef.current);setTRun(false)};
  const startT=(s)=>{clearInterval(iRef.current);setTLeft(s);setTRun(true)};

  const handleTO=useCallback(()=>{
    setCs("timeout");setToMsg(true);setHint(true);
    setLives(l=>{const nl=Math.max(0,l-1);setHb(nl);
      setTimeout(()=>{setHb(-1);setCs(null);setSel(null);setInp("");setToMsg(false);if(nl===0)setLives(3);setTkey(k=>k+1);startT(TIMERS[li])},1200);
      return nl});
  },[li]);

  useEffect(()=>{
    if(!tRun||trans||cs||isNeural)return;
    iRef.current=setInterval(()=>{setTLeft(t=>{if(t<=1){clearInterval(iRef.current);handleTO();return 0}return t-1})},1000);
    return()=>clearInterval(iRef.current);
  },[tRun,trans,cs,tkey,isNeural]);

  const advanceLevel=useCallback(()=>{
    if(li===LEVELS.length-1){onComplete(Date.now()-t0.current,lives)}
    else{
      const nl=li+1;
      setTrans({msg:"Level "+(li+1)+" Complete!",sub:"Moving to "+LEVELS[nl].name+"...",icon:LEVELS[nl].icon,note:"Timer: "+TIMERS[nl]+"s next level",bg:LEVELS[nl].bg,text:LEVELS[nl].text});
      setTimeout(()=>{setTrans(null);setLi(nl);setQi(0);setHint(false);setTkey(k=>k+1);startT(TIMERS[nl])},1000);
    }
  },[li,lives,LEVELS]);

  const advance=useCallback(()=>{
    if(isNeural||qi===1){advanceLevel();}
    else{setQi(1);setTkey(k=>k+1);startT(ts);}
  },[isNeural,qi,ts,advanceLevel]);

  const check=()=>{
    if(cs)return;
    const ok=q.type==="mcq"?sel===q.ci:inp.trim().toLowerCase()===q.answer.toLowerCase();
    if(ok){stopT();setCs("correct");setBurst(true);
      setTimeout(()=>setBurst(false),500);
      setTimeout(()=>{setCs(null);setHint(false);setToMsg(false);setSel(null);setInp("");advance()},500);
    } else {
      stopT();setCs("wrong");setLives(l=>{const nl=Math.max(0,l-1);setHb(nl);setHint(true);
        setTimeout(()=>{setHb(-1);setCs(null);setSel(null);setInp("");if(nl===0)setLives(3);setTkey(k=>k+1);startT(ts)},900);return nl});
    }
  };

  const pct=(tLeft/ts)*100,tst=tLeft>ts*.5?"ok":tLeft>ts*.2?"warn":"danger",tcol=tLeft>ts*.5?lv.ac:tLeft>ts*.2?"#E8A23C":"#E85757";
  const TOLS=["#FF8C5A","#5BAADB","#8B6BD8","#52C788","#E8608C","#FFB347"];

  return(<div className="screen game-screen" style={{background:lv.bg,paddingTop:56}}>
    <Banner sub={lv.name}/>
    {trans&&<div className="tovl" style={{background:trans.bg}}>
      <div style={{fontSize:"5rem",marginBottom:12,animation:"float 1s ease-in-out infinite"}}>{trans.icon}</div>
      <div className="ttitle" style={{color:trans.text}}>{trans.msg}</div>
      <div className="tsub" style={{color:trans.text}}>{trans.sub}</div>
      <div className="tnote" style={{color:trans.text}}>{trans.note}</div>
    </div>}
    {burst&&<div className="covl"><div className="cburst">✅</div></div>}
    <div className="gw" key={li+"-"+qi}>
      <div className="ghdr">
        <div className="lbadge" style={{borderColor:lv.ac,color:lv.text}}>Level {li+1}/5 — {lv.name}</div>
        <div className="lvs">{[0,1,2].map(i=><span key={i} className={"hrt"+(i>=lives?" lost":"")+(hb===i?" beat":"")}>❤️</span>)}</div>
      </div>
      {!isNeural&&<div className="trow">
        <div className={"tnum "+tst}>{tLeft}s</div>
        <div className="tbw"><div className="tbf" style={{width:pct+"%",background:tcol}}/></div>
        <div className="tlbl">time left</div>
      </div>}
      <div className="ptrow">
        <div className="pbw"><div className="pbf" style={{width:((li*2+qi)/10*100)+"%",background:lv.ac}}/></div>
        <span className="plbl">{li*2+qi}/10</span>
      </div>
      <div className="lscene" style={{background:lv.bg,boxShadow:"0 4px 20px "+lv.ac+"28"}}>
        <div className="sdeco">{lv.deco}</div>
        <div>
          <div className="stitle" style={{color:lv.text}}>{lv.name}</div>
          <div className="ssub" style={{color:lv.sub}}>{lv.sceneSub}</div>
        </div>
        <div className="sicon">{lv.icon}</div>
      </div>
      {!isNeural&&<div className="qdots">{lv.questions.map((_,i)=><div key={i} className={"qdot"+(i<qi?" done":i===qi?" active":"")}/>)}</div>}
      {isNeural?(
        <NeuralGame
          ac={lv.ac} acd={lv.acd}
          onWin={()=>{stopT();advanceLevel();}}
          onLoseLife={()=>{setLives(l=>{const nl=Math.max(0,l-1);setHb(nl);setTimeout(()=>setHb(-1),500);return nl;});}}
        />
      ):(
        <div className={"qcard"+(cs?" "+cs:"")} style={{borderColor:cs?"":lv.ac+"18"}}>
          <span className="qtag">{q.tag}</span>
          <span className="qem">{q.emoji}</span>
          <div className="qtxt">{q.question}</div>
          {q.type==="scramble"&&<div className="stiles">{q.tiles.map((l,i)=><div key={i} className="stile" style={{background:TOLS[i%TOLS.length],animationDelay:i*.05+"s"}}>{l}</div>)}</div>}
          {q.type==="mcq"&&<div className="opts">{q.options.map((o,i)=>(
            <button key={i} className={"obtn"+(sel===i?" sel":"")} style={sel===i?{borderColor:lv.ac,background:lv.ac+"12",boxShadow:"0 2px 0 "+lv.acd}:{}} onClick={()=>setSel(i)}>
              <div className="oltr" style={sel===i?{background:lv.ac,color:"#fff"}:{}}>{OPTS[i]}</div>{o}
            </button>
          ))}</div>}
          {(q.type==="fill"||q.type==="scramble")&&<input className="finp" type="text" placeholder="Type your answer..." value={inp} onChange={e=>setInp(e.target.value)} onKeyDown={e=>e.key==="Enter"&&canSub&&check()} style={inp?{borderColor:lv.ac}:{}} autoComplete="off" spellCheck={false}/>}
        </div>
      )}
      {toMsg&&<div className="tobar"><span>⏰</span><span><strong>Times up!</strong> You lose a heart. Here is a hint...</span></div>}
      {hint&&!isNeural&&<div className="hintbar"><span>💡</span><span><strong>Hint:</strong> {q.hint}</span></div>}
      {!isNeural&&<button className="bsub" disabled={!canSub||!!cs} onClick={check} style={canSub&&!cs?{background:lv.ac,boxShadow:"0 5px 0 "+lv.acd}:{}}>
        {cs==="correct"?"✅ Correct!":cs==="wrong"?"❌ Try again!":cs==="timeout"?"⏰ Times up!":"Submit Answer →"}
      </button>}
    </div>
  </div>);
}

function App(){
  const [screen,setScreen]=useState("login");const [player,setPlayer]=useState(null);const [result,setResult]=useState(null);
  const handleComplete=async(timeTaken,livesLeft)=>{
    await dbPush({name:player.name,email:player.email,empId:player.empId,timeTaken,livesLeft,ts:Date.now()});
    setResult({timeTaken,livesLeft});setScreen("complete");
  };
  return screen==="login"?<LoginScreen onLogin={(n,e,id)=>{setPlayer({name:n,email:e,empId:id});setScreen("start")}}/>:
    screen==="start"?<StartScreen player={player} onStart={()=>setScreen("game")}/>:
    screen==="game"?<GameScreen player={player} onComplete={handleComplete}/>:
    <CompleteScreen player={player} timeTaken={result.timeTaken} livesLeft={result.livesLeft} onRestart={()=>{setResult(null);setScreen("login")}}/>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
